name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 26
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 26.x

      - run: npm ci

      - name: Update package.json version from tag
        run: |
          # Extracts '1.2.3' from 'refs/tags/v1.2.3'
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version

      - run: npm run build

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 1

  stage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC token exchange with npm
    steps:
      - name: Download tarball
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: npm-package

      - name: Use Node.js 26
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'

      # Stages the package for review — does NOT publish to the live registry.
      # A maintainer must approve with 2FA via:
      #   npm stage approve <id>   (CLI)
      # or via the Staged Packages tab on npmjs.com.
      # NODE_AUTH_TOKEN is used as fallback if OIDC trusted publisher is not yet configured.
      - name: Stage package
        run: npm stage publish *.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
