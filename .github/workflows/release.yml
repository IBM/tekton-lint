name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - run: npm ci

      - name: Update package.json version from tag
        run: |
          # Extracts '1.2.3' from 'refs/tags/v1.2.3'
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version

      - run: npm run build

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          retention-days: 1

  stage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC token exchange with npm
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'

      # Stages the package for review — does NOT publish to the live registry.
      # A maintainer must approve with 2FA via:
      #   npm stage approve <id>   (CLI)
      # or via the Staged Packages tab on npmjs.com.
      # NODE_AUTH_TOKEN is used as fallback if OIDC trusted publisher is not yet configured.
      - name: Stage package
        run: npm stage publish *.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
